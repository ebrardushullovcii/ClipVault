# Netlify builds only the marketing site from this repo: the #clips landing page
# (marketing/sites/08-thread), deployed to https://getclipvault.netlify.app.
[build]
  base = "marketing/sites"
  command = "python3 build-deploy.py 08-thread https://getclipvault.netlify.app dist"
  publish = "dist"
  # Skip the build when nothing under marketing/sites changed.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."
